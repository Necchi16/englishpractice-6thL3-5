<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>えいごではなそう！</title>
  
  <!-- Tailwind CSSの読み込み -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- ReactとReactDOMの読み込み -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- ブラウザ上でReact(JSX)を動かすためのBabel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* アニメーション用のCSS */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }
    .mic-pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body class="bg-amber-50 font-sans text-gray-800">
  <!-- ここにアプリが表示されます -->
  <div id="root"></div>

  <!-- アプリのプログラム -->
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // --- 新しいモンスターデータ (全30種類) ---
    const MONSTERS = [
      { id: 1, name: "マシュマロうさぎ", emoji: "🐰", color: "bg-pink-100" },
      { id: 2, name: "チョコミン党くま", emoji: "🐻", color: "bg-teal-200" },
      { id: 3, name: "メロンパンかめ", emoji: "🐢", color: "bg-green-200" },
      { id: 4, name: "いちごショートねこ", emoji: "🐱", color: "bg-red-100" },
      { id: 5, name: "パンケーキらいおん", emoji: "🦁", color: "bg-yellow-200" },
      { id: 6, name: "オムライスきつね", emoji: "🦊", color: "bg-orange-200" },
      { id: 7, name: "エビフライいぬ", emoji: "🐶", color: "bg-amber-200" },
      { id: 8, name: "ハンバーガーぞう", emoji: "🐘", color: "bg-amber-300" },
      { id: 9, name: "ピザアルパカ", emoji: "🦙", color: "bg-orange-100" },
      { id: 10, name: "ドーナツひつじ", emoji: "🐑", color: "bg-pink-200" },
      { id: 11, name: "プリンはりねずみ", emoji: "🦔", color: "bg-yellow-100" },
      { id: 12, name: "クレープぺんぎん", emoji: "🐧", color: "bg-blue-100" },
      { id: 13, name: "たいやきふくろう", emoji: "🦉", color: "bg-orange-300" },
      { id: 14, name: "たこやきだこ", emoji: "🐙", color: "bg-red-200" },
      { id: 15, name: "おにぎりぱんだ", emoji: "🐼", color: "bg-gray-100" },
      { id: 16, name: "おちゃわんわん", emoji: "🐕", color: "bg-stone-200" },
      { id: 17, name: "カレーらいすとり", emoji: "🐓", color: "bg-yellow-300" },
      { id: 18, name: "パスタへび", emoji: "🐍", color: "bg-green-100" },
      { id: 19, name: "サラダかまきり", emoji: "🦗", color: "bg-green-300" },
      { id: 20, name: "スープかえる", emoji: "🐸", color: "bg-emerald-200" },
      { id: 21, name: "ステーキうし", emoji: "🐄", color: "bg-red-300" },
      { id: 22, name: "ポテトちんぱんじー", emoji: "🐒", color: "bg-yellow-400" },
      { id: 23, name: "アイスしろくま", emoji: "🐻‍❄️", color: "bg-cyan-100" },
      { id: 24, name: "かきごおりはくちょう", emoji: "🦢", color: "bg-sky-200" },
      { id: 25, name: "わたあめひつじ", emoji: "🐏", color: "bg-fuchsia-100" },
      { id: 26, name: "ポップコーンらくだ", emoji: "🐪", color: "bg-amber-100" },
      { id: 27, name: "りんごあめぶた", emoji: "🐷", color: "bg-red-400" },
      { id: 28, name: "チョコバナナさる", emoji: "🐵", color: "bg-yellow-200" },
      { id: 29, name: "ホットドッグいぬ", emoji: "🐕‍🦺", color: "bg-orange-400" },
      { id: 30, name: "マカロンちょうちょ", emoji: "🦋", color: "bg-purple-200" }
    ];

    // --- アプリケーション本体 ---
    function App() {
      const [step, setStep] = useState('HOME'); 
      const [playCount, setPlayCount] = useState(0);
      const [collections, setCollections] = useState([]);
      
      // 入力用ステート
      const [hour, setHour] = useState(7);
      const [minute, setMinute] = useState(0);
      const [jaFood, setJaFood] = useState("");
      const [engFood, setEngFood] = useState("");
      const [isTranslating, setIsTranslating] = useState(false);
      
      const [failCount, setFailCount] = useState(0);
      const [isListening, setIsListening] = useState(false);
      const [isFoodListening, setIsFoodListening] = useState(false);
      const [recognitionText, setRecognitionText] = useState("");
      const [feedbackMsg, setFeedbackMsg] = useState("");
      
      const [currentGachaMonster, setCurrentGachaMonster] = useState(null);
      const [isRolling, setIsRolling] = useState(false);
      const [rollEmoji, setRollEmoji] = useState("🎁");

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      // 初期化：ローカルストレージからデータ読み込み
      useEffect(() => {
        const savedCount = localStorage.getItem('englishAppPlayCount_v2');
        if (savedCount) setPlayCount(parseInt(savedCount, 10));

        const savedCollections = localStorage.getItem('englishAppCollections_v2');
        if (savedCollections) setCollections(JSON.parse(savedCollections));
      }, []);

      // データ保存
      const saveData = (newCount, newCollections) => {
        localStorage.setItem('englishAppPlayCount_v2', newCount.toString());
        localStorage.setItem('englishAppCollections_v2', JSON.stringify(newCollections));
        setPlayCount(newCount);
        setCollections(newCollections);
      };

      // --- 音声合成 (TTS) ---
      const speak = useCallback((text, rate = 0.9) => {
        if (synth.speaking) {
          synth.cancel();
        }
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = rate; 
        
        const voices = synth.getVoices();
        const englishVoice = voices.find(voice => voice.lang.includes('en-US') && voice.name.includes('Female')) || voices.find(voice => voice.lang.includes('en-US'));
        if (englishVoice) {
          utterThis.voice = englishVoice;
        }
        
        synth.speak(utterThis);
      }, [synth]);

      // コンピューターの回答時の自動音声再生
      useEffect(() => {
        if (step === 'COM_ANSWER') {
          const timer = setTimeout(() => {
            speak("I usually eat breakfast at 7 o'clock. I sometimes eat toast for breakfast.");
          }, 800);
          return () => clearTimeout(timer);
        }
      }, [step, speak]);

      // --- 日本語から英語への翻訳処理 (Gemini API) ---
      const translateFood = async () => {
        if (!jaFood.trim() || jaFood === "きいています...") return;
        setIsTranslating(true);
        
        const apiKey = "";
        const prompt = `次の日本語の食べ物の名前を、英語の単語(小文字)に翻訳してください。冠詞(a, an)はつけず、答えの英単語のみを出力してください。\n日本語: ${jaFood}`;
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
            contents: [{ parts: [{ text: prompt }] }]
        };

        let retries = 5;
        let delay = 1000;
        let translated = "";

        while (retries > 0) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    const data = await response.json();
                    translated = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                    translated = translated.replace(/[.!?。、\n]/g, "").toLowerCase().trim();
                    break;
                }
            } catch (e) {
                console.error("Translation error, retrying...", e);
            }
            retries--;
            if (retries > 0) await new Promise(res => setTimeout(res, delay));
            delay *= 2;
        }
        
        if (!translated) {
            translated = "something"; // エラー時のフォールバック
        }

        setEngFood(translated);
        setIsTranslating(false);
        setFailCount(0);
        setStep('SPEAK_PRACTICE');
      };

      // --- 音声認識 (STT) 食べ物入力用 (日本語) ---
      const startFoodListening = () => {
        if (!SpeechRecognition) {
          alert("お使いのブラウザは音声入力に対応していません。キーボードで入力してください。");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        setIsFoodListening(true);
        setJaFood("きいています...");

        recognition.onresult = (event) => {
          let transcript = event.results[0][0].transcript;
          transcript = transcript.replace(/[.,。、]/g, "").trim();
          setJaFood(transcript);
        };

        recognition.onerror = (event) => {
          console.error("Speech recognition error", event.error);
          setJaFood("");
          alert("うまくききとれませんでした。もういちどおすか、キーボードでいれてね。");
        };

        recognition.onend = () => {
          setIsFoodListening(false);
        };

        recognition.start();
      };

      // --- 音声認識 (STT) 発音練習用 ---
      const startListening = (targetType = 'SPEAK_PRACTICE') => {
        if (!SpeechRecognition) {
          alert("お使いのブラウザは音声入力に対応していません。スキップボタンで進んでください。");
          setFailCount(5); 
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        setIsListening(true);
        setRecognitionText("きいています...");
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.toLowerCase();
          setRecognitionText(transcript);
          if (targetType === 'ASK_COM_TIME') {
            checkAskPronunciation(transcript);
          } else {
            checkPronunciation(transcript);
          }
        };

        recognition.onerror = (event) => {
          console.error("Speech recognition error", event.error);
          setIsListening(false);
          setRecognitionText("うまくききとれませんでした。もういちどボタンをおしてね。");
          setFailCount(prev => prev + 1);
        };

        recognition.onend = () => {
          setIsListening(false);
        };

        recognition.start();
      };

      const checkPronunciation = (transcript) => {
        const lowerTranscript = transcript.toLowerCase();
        const lowerFood = engFood.toLowerCase();
        
        // 時間のチェック (数字または英単語が含まれているか)
        const hourWords = ["one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
        const hasHour = lowerTranscript.includes(hour.toString()) || lowerTranscript.includes(hourWords[hour - 1]);
        
        // 食べ物のチェック
        const hasFood = lowerFood ? lowerTranscript.includes(lowerFood) : true;

        // キーワードのチェック
        const hasKeyword = lowerTranscript.includes("breakfast") || lowerTranscript.includes("usually") || lowerTranscript.includes("sometimes");

        // 少し甘めの判定（食べ物 か 時間 が言えていて、キーワードが含まれていればOK）
        const isCorrect = (hasFood || hasHour) && hasKeyword;

        if (isCorrect || lowerTranscript.length > 10) { // 長く喋れていたらOKとする救済措置
          setFeedbackMsg("Excellent! 👏");
          setTimeout(() => speak("Excellent!"), 500);
          setTimeout(() => {
            proceedToNext('ASK_COM_TIME');
          }, 2000);
        } else {
          setFeedbackMsg("おしい！もういちどチャレンジ！");
          setFailCount(prev => prev + 1);
        }
      };

      const checkAskPronunciation = (transcript) => {
        const lowerTranscript = transcript.toLowerCase();
        const hasKeyword = lowerTranscript.includes("what") && lowerTranscript.includes("time") && lowerTranscript.includes("breakfast");
        
        if (hasKeyword || lowerTranscript.length > 15) { // 甘めの判定
          setFeedbackMsg("Excellent! 👏");
          setTimeout(() => speak("Excellent!"), 500);
          setTimeout(() => {
            proceedToNext('COM_ANSWER');
          }, 2000);
        } else {
          setFeedbackMsg("おしい！もういちどチャレンジ！");
          setFailCount(prev => prev + 1);
        }
      };

      const proceedToNext = (nextStep) => {
        setFailCount(0);
        setRecognitionText("");
        setFeedbackMsg("");
        setStep(nextStep);
      };

      // --- ガチャロジック ---
      const rollGacha = () => {
        setIsRolling(true);
        
        const intervalId = setInterval(() => {
          const randomMonster = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
          setRollEmoji(randomMonster.emoji);
        }, 100);

        const ownedIds = collections.map(c => c.id);
        const unownedMonsters = MONSTERS.filter(m => !ownedIds.includes(m.id));

        let newMonster;
        if (unownedMonsters.length > 0) {
          const randomIndex = Math.floor(Math.random() * unownedMonsters.length);
          newMonster = unownedMonsters[randomIndex];
        } else {
          const randomIndex = Math.floor(Math.random() * MONSTERS.length);
          newMonster = MONSTERS[randomIndex];
        }

        setTimeout(() => {
          clearInterval(intervalId);
          setIsRolling(false);
          setCurrentGachaMonster(newMonster);
          
          if (!ownedIds.includes(newMonster.id)) {
            saveData(playCount + 1, [...collections, newMonster]);
          } else {
            saveData(playCount + 1, collections);
          }
        }, 2500);
      };

      const renderHeader = (title, colorClass = "bg-amber-500") => (
        <div className={`${colorClass} text-white p-4 rounded-t-2xl flex items-center justify-center font-bold text-xl mb-4 shadow-md`}>
          {title}
        </div>
      );

      // 時間の文字列を生成
      const timeString = minute === 0 ? `${hour}:00` : `${hour}:${minute < 10 ? '0'+minute : minute}`;

      // === 各画面のレンダリング ===

      if (step === 'HOME') {
        return (
          <div className="min-h-screen p-4 md:p-8 flex flex-col justify-center">
            <div className="max-w-2xl w-full mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-amber-200">
              <div className="bg-gradient-to-r from-amber-400 to-orange-500 p-8 text-center text-white">
                <h1 className="text-3xl md:text-4xl font-extrabold mb-4 drop-shadow-md">えいごで はなそう！</h1>
                <p className="text-lg bg-white/20 inline-block px-4 py-2 rounded-full font-medium">
                  🎧 イヤホンを つけましょう 🎧
                </p>
              </div>
              
              <div className="p-8 text-center">
                <button 
                  onClick={() => {
                    setStep('GREETING');
                    setTimeout(() => speak("What time do you eat breakfast?"), 500);
                  }}
                  className="bg-red-500 hover:bg-red-600 text-white text-2xl font-bold py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center mx-auto mb-8"
                >
                  <span className="mr-2 text-2xl">▶️</span> スタート！
                </button>

                <div className="bg-amber-50 rounded-2xl p-6 border-2 border-amber-200">
                  <h2 className="text-xl font-bold text-amber-700 mb-4 flex items-center justify-center">
                    <span className="mr-2">⭐</span> あつめたモンスター ({collections.length}/30)
                  </h2>
                  <div className="grid grid-cols-5 gap-2 md:gap-4">
                    {collections.map(m => (
                      <div key={m.id} className={`${m.color} p-2 rounded-xl text-center shadow-sm text-2xl relative group cursor-default`} title={m.name}>
                        {m.emoji}
                        <div className="absolute hidden group-hover:block bg-black text-white text-xs p-1 rounded -top-8 left-1/2 transform -translate-x-1/2 whitespace-nowrap z-10">
                          {m.name}
                        </div>
                      </div>
                    ))}
                    {Array.from({ length: 30 - collections.length }).map((_, i) => (
                      <div key={`empty-${i}`} className="bg-gray-100 p-2 rounded-xl text-center border-2 border-dashed border-gray-300 text-2xl opacity-50">
                        ❓
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (step === 'GREETING') {
        return (
          <div className="min-h-screen bg-green-50 p-4 md:p-8 flex items-center justify-center">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-green-200 text-center">
              {renderHeader("コンピューターからの しつもん", "bg-green-500")}
              
              <div className="mb-8 mt-4">
                <button onClick={() => speak("What time do you eat breakfast?")} className="bg-green-100 p-4 rounded-full text-green-600 hover:bg-green-200 transition mx-auto flex items-center justify-center mb-6 shadow-sm">
                  <span className="text-4xl">🔊</span>
                </button>
                <p className="text-2xl font-bold text-gray-800">"What time do you eat breakfast?"</p>
                <p className="text-gray-500 mt-3 font-medium">（なんじに あさごはんを たべますか？）</p>
              </div>

              <button 
                onClick={() => setStep('INPUT_FORM')}
                className="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-4 rounded-xl shadow-md transition transform hover:scale-105 active:scale-95"
              >
                こたえを つくる！
              </button>
            </div>
          </div>
        );
      }

      if (step === 'INPUT_FORM') {
        const canProceed = jaFood.trim() !== "" && jaFood !== "きいています..." && !isTranslating;

        return (
          <div className="min-h-screen bg-blue-50 p-4 md:p-8 flex items-center justify-center">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-blue-200">
              {renderHeader("こたえを にゅうりょく", "bg-blue-500")}
              
              <div className="bg-blue-50 p-6 rounded-2xl mb-6">
                <div className="mb-6">
                  <p className="text-lg font-bold mb-3 text-blue-800">🕘 あさごはんを たべる時間は？</p>
                  <div className="flex items-center justify-center gap-2 text-xl bg-white p-4 rounded-xl border-2 border-blue-200">
                    <select 
                      value={hour} 
                      onChange={(e) => setHour(parseInt(e.target.value))}
                      className="p-2 border-2 border-gray-300 rounded-lg bg-white font-bold cursor-pointer"
                    >
                      {Array.from({length: 12}, (_, i) => i + 1).map(h => (
                        <option key={h} value={h}>{h}</option>
                      ))}
                    </select>
                    <span className="font-bold">時</span>
                    <select 
                      value={minute} 
                      onChange={(e) => setMinute(parseInt(e.target.value))}
                      className="p-2 border-2 border-gray-300 rounded-lg bg-white font-bold cursor-pointer"
                    >
                      <option value={0}>00</option>
                      <option value={15}>15</option>
                      <option value={30}>30</option>
                      <option value={45}>45</option>
                    </select>
                    <span className="font-bold">分</span>
                  </div>
                </div>

                <div>
                  <p className="text-lg font-bold mb-3 text-blue-800">🍞 なにを たべる？（日本語で）</p>
                  <p className="text-sm text-gray-600 mb-2">手でいれるか、マイクをおして 日本語で いってね。</p>
                  <div className="flex items-center gap-2">
                    <input 
                      type="text" 
                      value={jaFood}
                      onChange={(e) => setJaFood(e.target.value)}
                      placeholder="例：パン、ごはん、りんご"
                      className="flex-1 p-3 border-2 border-gray-300 rounded-xl font-bold w-full text-lg"
                    />
                    <button 
                      onClick={startFoodListening}
                      disabled={isFoodListening}
                      className={`p-3 rounded-xl shadow-md transition flex-shrink-0 ${isFoodListening ? 'bg-red-500 mic-pulse text-white' : 'bg-white border-2 border-blue-400 text-blue-500 hover:bg-blue-100'}`}
                      title="マイクで日本語を入力"
                    >
                      <span className="text-2xl">🎤</span>
                    </button>
                  </div>
                </div>
              </div>

              <button 
                onClick={translateFood}
                disabled={!canProceed}
                className={`w-full text-white text-xl font-bold py-4 rounded-xl shadow-md transition flex justify-center items-center ${canProceed ? 'bg-blue-500 hover:bg-blue-600 transform hover:scale-105 active:scale-95' : 'bg-gray-300 cursor-not-allowed'}`}
              >
                {isTranslating ? (
                  <span className="animate-pulse">えいごに ほんやく中... 🔄</span>
                ) : (
                  "つぎへ"
                )}
              </button>
            </div>
          </div>
        );
      }

      if (step === 'SPEAK_PRACTICE') {
        const sentence1 = `I usually eat breakfast at ${timeString}.`;
        const sentence2 = `I sometimes eat ${engFood} for breakfast.`;
        
        const playExample = () => {
          const speakTime = minute === 0 ? `${hour} o'clock` : `${hour} ${minute}`;
          const speakSentence1 = `I usually eat breakfast at ${speakTime}.`;
          speak(`${speakSentence1} ${sentence2}`);
        };

        return (
          <div className="min-h-screen bg-pink-50 p-4 md:p-8 flex items-center justify-center">
            <div className="max-w-xl w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-pink-200 text-center">
              {renderHeader("えいごで いってみよう！", "bg-pink-500")}
              
              <div className="bg-pink-100 p-6 rounded-2xl mb-8 relative">
                <div className="absolute -top-3 -right-3 bg-yellow-400 text-xs font-bold px-3 py-1 rounded-full shadow border-2 border-white transform rotate-6">
                  {jaFood} 👉 {engFood}
                </div>
                <div className="text-2xl md:text-3xl font-bold text-pink-700 mb-4 leading-relaxed">
                  <p>{sentence1}</p>
                  <p>{sentence2}</p>
                </div>
                <button onClick={playExample} className="flex items-center justify-center mx-auto text-pink-600 hover:text-pink-800 bg-white px-5 py-3 rounded-full shadow-sm font-bold transition transform hover:scale-105">
                  <span className="mr-2 text-xl">🔊</span> おてほんをきく
                </button>
              </div>

              <div className="mb-8">
                <button 
                  onClick={() => startListening('SPEAK_PRACTICE')}
                  disabled={isListening}
                  className={`p-6 rounded-full shadow-lg transition transform hover:scale-105 active:scale-95 ${isListening ? 'bg-red-500 mic-pulse' : 'bg-blue-500 hover:bg-blue-600'} text-white mx-auto flex items-center justify-center`}
                >
                  <span className="text-4xl">🎤</span>
                </button>
                <p className="mt-4 text-gray-600 font-bold">{isListening ? "はなしてください..." : "マイクをおして はなす"}</p>
                
                {recognitionText && (
                   <div className="mt-4 p-3 bg-gray-100 rounded-lg text-lg text-gray-700 italic border border-gray-200">
                     ききとったことば: "{recognitionText}"
                   </div>
                )}
                {feedbackMsg && (
                   <div className={`mt-4 text-xl font-bold ${feedbackMsg.includes('Excellent') ? 'text-green-500' : 'text-orange-500'}`}>
                     {feedbackMsg}
                   </div>
                )}
              </div>

              <div className="flex flex-col gap-4">
                <button 
                  onClick={() => setStep('INPUT_FORM')}
                  className="text-gray-500 underline text-sm py-2 hover:text-gray-700"
                >
                  こたえを 入力しなおす (訂正する)
                </button>

                {failCount >= 5 && (
                  <button 
                    onClick={() => proceedToNext('ASK_COM_TIME')}
                    className="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-6 rounded-xl flex items-center justify-center mx-auto transition"
                  >
                    <span className="mr-2">⏭️</span> むずかしいので スキップ
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      if (step === 'ASK_COM_TIME') {
        return (
          <div className="min-h-screen bg-orange-50 p-4 md:p-8 flex items-center justify-center">
            <div className="max-w-xl w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-orange-200 text-center">
              {renderHeader("コンピューターに きいてみよう！", "bg-orange-500")}
              
              <div className="bg-orange-100 p-6 rounded-2xl mb-8">
                <div className="text-2xl md:text-3xl font-bold text-orange-700 mb-4 leading-relaxed">
                  <p>"What time do you eat breakfast?"</p>
                </div>
                <button onClick={() => speak("What time do you eat breakfast?")} className="flex items-center justify-center mx-auto text-orange-600 hover:text-orange-800 bg-white px-5 py-3 rounded-full shadow-sm font-bold transition transform hover:scale-105">
                  <span className="mr-2 text-xl">🔊</span> おてほんをきく
                </button>
              </div>

              <div className="mb-8">
                <button 
                  onClick={() => startListening('ASK_COM_TIME')}
                  disabled={isListening}
                  className={`p-6 rounded-full shadow-lg transition transform hover:scale-105 active:scale-95 ${isListening ? 'bg-red-500 mic-pulse' : 'bg-blue-500 hover:bg-blue-600'} text-white mx-auto flex items-center justify-center`}
                >
                  <span className="text-4xl">🎤</span>
                </button>
                <p className="mt-4 text-gray-600 font-bold">{isListening ? "はなしてください..." : "マイクをおして はなす"}</p>
                
                {recognitionText && (
                   <div className="mt-4 p-3 bg-gray-100 rounded-lg text-lg text-gray-700 italic border border-gray-200">
                     ききとったことば: "{recognitionText}"
                   </div>
                )}
                {feedbackMsg && (
                   <div className={`mt-4 text-xl font-bold ${feedbackMsg.includes('Excellent') ? 'text-green-500' : 'text-orange-500'}`}>
                     {feedbackMsg}
                   </div>
                )}
              </div>

              <div className="flex flex-col gap-4">
                {failCount >= 5 && (
                  <button 
                    onClick={() => proceedToNext('COM_ANSWER')}
                    className="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-6 rounded-xl flex items-center justify-center mx-auto transition"
                  >
                    <span className="mr-2">⏭️</span> むずかしいので スキップ
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      if (step === 'COM_ANSWER') {
        const comSentence1 = "I usually eat breakfast at 7:00.";
        const comSentence2 = "I sometimes eat toast for breakfast.";
        
        const playComAnswer = () => {
          speak("I usually eat breakfast at 7 o'clock. I sometimes eat toast for breakfast.");
        };

        return (
          <div className="min-h-screen bg-teal-50 p-4 md:p-8 flex items-center justify-center">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-teal-200 text-center">
              {renderHeader("コンピューターの こたえ", "bg-teal-500")}
              
              <div className="mb-8 mt-4">
                <div className="bg-gray-200 w-24 h-24 rounded-full mx-auto mb-4 flex items-center justify-center text-5xl shadow-inner border-2 border-gray-300">
                  💻
                </div>
                <button onClick={playComAnswer} className="bg-teal-100 p-4 rounded-full text-teal-600 hover:bg-teal-200 transition mx-auto flex items-center justify-center mb-6 shadow-sm">
                  <span className="text-4xl">🔊</span>
                </button>
                <div className="text-xl md:text-2xl font-bold text-gray-700 mb-4 leading-relaxed">
                  <p>"{comSentence1}</p>
                  <p>{comSentence2}"</p>
                </div>
                <div className="text-gray-500 mt-4 text-sm bg-gray-50 p-3 rounded-lg inline-block">
                  <p>（わたしは たいてい 7時に あさごはんを たべます。）</p>
                  <p>（ときどき トーストを たべます。）</p>
                </div>
              </div>

              <button 
                onClick={() => setStep('NOTEBOOK')}
                className="w-full bg-teal-500 hover:bg-teal-600 text-white text-xl font-bold py-4 rounded-xl shadow-md transition transform hover:scale-105 active:scale-95"
              >
                つぎへ
              </button>
            </div>
          </div>
        );
      }

      if (step === 'NOTEBOOK') {
        const sentence1 = `I usually eat breakfast at ${timeString}.`;
        const sentence2 = `I sometimes eat ${engFood} for breakfast.`;

        return (
          <div className="min-h-screen bg-yellow-50 p-4 md:p-8 flex items-center justify-center">
            <div className="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-yellow-300">
              <div className="flex items-center justify-center text-yellow-600 mb-6">
                <span className="mr-4 text-4xl">📖</span>
                <h2 className="text-3xl font-bold">ノートに かきましょう</h2>
              </div>
              
              <div className="bg-white border-2 border-gray-300 p-6 md:p-8 rounded-lg shadow-inner mb-8 bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')]">
                <p className="text-gray-600 mb-6 font-bold text-lg bg-white/80 inline-block px-2">あとで はっぴょうするので、じぶんの こたえを ノートに うつしてね。</p>
                <div className="text-2xl font-mono text-gray-800 leading-loose border-b-2 border-dashed border-gray-400 mb-4 pb-2 bg-white/60 px-2">
                  {sentence1}
                </div>
                <div className="text-2xl font-mono text-gray-800 leading-loose bg-white/60 px-2">
                  {sentence2}
                </div>
              </div>

              <div className="bg-red-50 p-6 rounded-xl border border-red-200 text-center mb-8">
                <p className="text-red-700 font-bold text-lg mb-2">ノートが かけたら、先生を よんで スタンプを もらいましょう！</p>
                <p className="text-gray-600">スタンプを もらったら、下のボタンを おしてね。</p>
              </div>

              <button 
                onClick={() => setStep('GACHA')}
                className="w-full bg-yellow-500 hover:bg-yellow-600 text-white text-2xl font-bold py-4 rounded-xl shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center"
              >
                <span className="mr-2 text-3xl">💮</span> スタンプをもらった！
              </button>
            </div>
          </div>
        );
      }

      if (step === 'GACHA') {
        return (
          <div className="min-h-screen bg-indigo-900 p-4 md:p-8 flex items-center justify-center overflow-hidden relative">
            <div className="absolute inset-0 opacity-50 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-700 via-indigo-900 to-black"></div>

            <div className="max-w-lg w-full bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl p-8 text-center relative z-10 border border-white/20">
              <h2 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500 mb-8 drop-shadow-lg">
                おたのしみ ガチャ！
              </h2>

              {!currentGachaMonster ? (
                <div className="mb-12">
                  {isRolling ? (
                    <div className="flex flex-col items-center justify-center">
                      <p className="text-yellow-300 font-bold text-2xl mb-8 animate-pulse">なにがでるかな...？</p>
                      <div className="w-48 h-48 mx-auto bg-white rounded-full flex items-center justify-center shadow-[0_0_80px_rgba(255,255,255,0.8)] mb-8 border-4 border-yellow-300 transform transition-all duration-100 scale-110">
                        <span className="text-8xl filter drop-shadow-md">{rollEmoji}</span>
                      </div>
                      <div className="flex justify-center gap-6 text-4xl">
                         <span className="animate-spin">✨</span>
                         <span className="animate-bounce">🌟</span>
                         <span className="animate-spin">✨</span>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div className="w-48 h-48 mx-auto bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(236,72,153,0.5)] animate-bounce mb-8 border-4 border-white/30">
                        <span className="text-7xl">🎁</span>
                      </div>
                      <button 
                        onClick={rollGacha}
                        className="bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-500 hover:to-orange-600 text-white text-3xl font-black py-5 px-12 rounded-full shadow-2xl transform transition hover:scale-110 active:scale-95 border-4 border-yellow-200"
                      >
                        ガチャを まわす！
                      </button>
                    </>
                  )}
                </div>
              ) : (
                <div className="mb-8 animate-fade-in-up">
                  <p className="text-yellow-300 font-bold text-xl mb-4">ゲットした モンスターは…</p>
                  <div className={`${currentGachaMonster.color} w-64 h-64 mx-auto rounded-full flex flex-col items-center justify-center shadow-[0_0_60px_rgba(255,255,255,0.4)] mb-6 border-8 border-white`}>
                    <span className="text-8xl mb-2 filter drop-shadow-md">{currentGachaMonster.emoji}</span>
                  </div>
                  <h3 className="text-4xl font-extrabold text-white mb-8 drop-shadow-md">{currentGachaMonster.name}</h3>
                  
                  <button 
                    onClick={() => {
                      setCurrentGachaMonster(null);
                      setStep('HOME');
                    }}
                    className="bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-4 px-8 rounded-full shadow-lg flex items-center justify-center mx-auto transition transform hover:scale-105"
                  >
                    <span className="mr-2">🏠</span> さいしょに もどる
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      return null;
    }

    // Reactアプリの描画
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
